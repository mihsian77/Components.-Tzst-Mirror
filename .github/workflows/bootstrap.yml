name: bootstrap
on:
  push:
    branches: [ main, master ]
    paths: [ .github/workflows/bootstrap.yml ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate all files
        run: echo '' | base64 -d | python3
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bootstrap: generated repo files" || echo "no changes"
          git push
